name: Daily Multimodal Causal Papers

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 8:00，如需北京时间早上8点，改为 '0 0 * * *' (UTC 0:00)
  workflow_dispatch:

jobs:
  paper-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: pip install arxiv requests google-generativeai  # 若使用 Gemini
      - name: 搜索并精读论文
        run: python scripts/fetch_and_summarize.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAPER_KEYWORD: "multimodal causal inference"
      - name: 发送邮件
        run: python scripts/send_email.py
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}          # 改为匹配你的 Secret 名称
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
